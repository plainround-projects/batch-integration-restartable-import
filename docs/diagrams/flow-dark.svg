<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">One import run, step by step</title>
<desc id="d">A numbered run of make run across four lanes: make run, ImportCatalog, Batch job and PostgreSQL. ImportRunner builds the request (2). The run lock is taken with pg_try_advisory_lock (3); if another run holds it the result is BLOCKED with exit code 4 (3x). Crashed runs are marked FAILED (4). The job is launched with file and run.id (5); the same pair already completed is refused with exit code 3 (5x). Each chunk of 1,000 rows commits with the reader position (6). A bad row is skipped and recorded (6x), and a transient error is retried up to 3 times (7). The rejects are exported and the run ends COMPLETED with exit code 0 (8).</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="899" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="898" rx="16"/>
<text class="title" x="48" y="68">One import run, step by step</text>
<text class="caption" x="48" y="100">One run from make run to COMPLETED. Amber rows: another run holds the lock, the same run again, and a bad row.</text>
<rect class="actor" x="370" y="128" width="120" height="48" rx="24"/>
<text class="lane" x="430" y="158" text-anchor="middle">make run</text>
<rect class="svc" x="530" y="128" width="161" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">ImportCatalog</text>
<rect class="svc" x="720" y="128" width="120" height="48" rx="10"/>
<text class="lane" x="780" y="158" text-anchor="middle">Batch job</text>
<rect class="svc" x="875" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">PostgreSQL</text>
<path class="hair" d="M430 176V232M610 176V808M780 176V744M940 176V808"/>
<path class="hair" d="M66 216V792"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="212">ImportRunner builds the request</text>
<text class="sub" x="96" y="232">--import.file and --run.id</text>
<path class="sync" d="M430 216H610"/>
<text class="label t-accent" x="446" y="206">ImportRequest</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="276">The run lock is taken</text>
<text class="sub" x="96" y="296">pg_try_advisory_lock, one process</text>
<path class="sync" d="M610 280H940"/>
<text class="label t-accent" x="796" y="270">advisory lock</text>
<circle class="dot-w" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="340">Lock held: BLOCKED</text>
<text class="sub" x="96" y="360">another live run: exit code 4</text>
<path class="fail" d="M940 344H610"/>
<text class="label t-warn" x="626" y="334">held</text>
<circle class="dot" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="404">Crashed runs are recovered</text>
<text class="sub" x="96" y="424">STARTED to FAILED, counts kept</text>
<path class="sync" d="M610 408H940"/>
<text class="label t-accent" x="796" y="398">mark FAILED</text>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="468">The job is launched</text>
<text class="sub" x="96" y="488">file + run.id: the instance id</text>
<path class="sync" d="M610 472H780"/>
<text class="label t-accent" x="626" y="462">launch</text>
<circle class="dot-w" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5x</text>
<text class="label b t-warn" x="96" y="532">Same pair, completed: refused</text>
<text class="sub" x="96" y="552">ALREADY_COMPLETE, exit code 3</text>
<path class="fail" d="M780 536H610"/>
<text class="label t-warn" x="626" y="526">refused</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="596">A chunk of 1,000 commits</text>
<text class="sub" x="96" y="616">rows + position, one transaction</text>
<path class="sync" d="M780 600H940"/>
<text class="label t-accent" x="796" y="590">chunk commit</text>
<circle class="dot-w" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="660">A bad row is skipped</text>
<text class="sub" x="96" y="680">recorded as (file, line, reason)</text>
<path class="fail" d="M780 664H940"/>
<text class="label t-warn" x="796" y="654">reject row</text>
<circle class="dot" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="724">A transient error is retried</text>
<text class="sub" x="96" y="744">3 attempts, then the step fails</text>
<rect class="slot" x="774" y="710" width="12" height="36" rx="4"/>
<text class="label t-accent" x="796" y="733">retry, up to 3</text>
<circle class="dot-g" cx="66" cy="792" r="15"/><text class="num" x="66" y="797" text-anchor="middle">8</text>
<text class="label b t-ink" x="96" y="788">rejects.txt is exported</text>
<text class="sub" x="96" y="808">then COMPLETED, exit code 0</text>
<path class="sync" d="M610 792H940"/>
<text class="label t-accent" x="636" y="782">export rejects</text>
<path class="ok" d="M946 792H1024"/>
<rect class="win" x="1024" y="772" width="124" height="40" rx="10"/>
<text class="label b t-good" x="1040" y="797">COMPLETED</text>
<path class="sync" d="M48 856H112"/><text class="legend" x="124" y="861">sync call</text>
<path class="fail" d="M696 856H760"/><text class="legend" x="772" y="861">failure path</text>
<path class="ok" d="M928 856H992"/><text class="legend" x="1004" y="861">result</text>
</svg>
