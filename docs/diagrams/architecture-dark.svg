<rect class="slot" x="376" y="248" width="142" height="28" rx="6"/>
<text class="label t-accent" x="447" y="267" text-anchor="middle">Crash recovery</text>
<rect class="boundary" x="264" y="336" width="292" height="416" rx="14"/>
<text class="tag" x="280" y="364">Import job, chunk 1,000</text>
<rect class="svc" x="284" y="388" width="252" height="84" rx="12"/>
<text class="name" x="300" y="420">Flat-file reader</text>
<text class="sub" x="300" y="444">ProductLineMapper</text>
